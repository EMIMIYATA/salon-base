<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SalonBase Owner Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#FAF7F2] text-[#2D2A26] min-h-screen flex items-center justify-center p-4">
  <div id="login-box" class="w-full max-w-md bg-white rounded-2xl shadow p-6 border border-[#EAE3D9]">
    <h1 class="text-xl font-bold mb-2">SalonBase Owner Console</h1>
    <p class="text-sm text-[#6E675F] mb-5">オーナー管理画面にログインしてください。</p>
    <form id="admin-login-form" class="space-y-4">
      <div>
        <label class="block text-xs font-bold mb-1">メールアドレス または 割り当て番号</label>
        <input id="login-id" type="text" required placeholder="例: SB-2026-9482"
          class="w-full px-3 py-2.5 rounded-xl border border-[#DDD5C9] text-sm" />
      </div>
      <div>
        <label class="block text-xs font-bold mb-1">パスワード</label>
        <input id="login-password" type="password" required
          class="w-full px-3 py-2.5 rounded-xl border border-[#DDD5C9] text-sm" />
      </div>
      <p id="login-error" class="text-xs text-red-600 hidden"></p>
      <button type="submit"
        class="w-full py-3 rounded-full bg-[#B87A63] text-white text-sm font-bold">
        ログインする
      </button>
    </form>
  </div>

  <div id="admin-dashboard" class="w-full max-w-4xl bg-white rounded-2xl shadow p-6 border border-[#EAE3D9] hidden">
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-xl font-bold">オーナー管理画面</h1>
      <button id="logout-btn" class="px-4 py-1.5 rounded-full border text-xs">ログアウト</button>
    </div>
    <p class="text-sm text-[#6E675F]">ログインが完了しました。ここにエントリー情報や掲載設定を表示します。</p>
  </div>

  <script>
    const loginForm = document.getElementById('admin-login-form');
    const loginBox = document.getElementById('login-box');
    const dashboard = document.getElementById('admin-dashboard');
    const errorEl = document.getElementById('login-error');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.add('hidden');

      const identifier = document.getElementById('login-id').value.trim();
      const password = document.getElementById('login-password').value;

      try {
        // 認証用APIがある場合は /api/admin/login などに接続してください
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier, password })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || data.ok === false) {
          throw new Error(data.error || 'ログイン情報を確認してください。');
        }
        loginBox.classList.add('hidden');
        dashboard.classList.remove('hidden');
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.remove('hidden');
      }
    });

    document.getElementById('logout-btn').addEventListener('click', () => {
      dashboard.classList.add('hidden');
      loginBox.classList.remove('hidden');
      loginForm.reset();
    });
  </script>
</body>
</html>
