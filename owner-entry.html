<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SalonBase | オーナー管理画面</title>
  <style>
    :root {
      --bg: #FAF7F2;
      --card: #FFFFFF;
      --sand: #F3ECE1;
      --text: #3D352E;
      --muted: #7A6F66;
      --line: #E6DDD0;
      --accent: #C4826E;
      --accent-hover: #B06F5B;
      --accent-text: #FFFFFF;
      --req-bg: #F9EFEA;
      --req-text: #B06F5B;
      --ok-bg: #EBF2EE;
      --ok-text: #3B5E4C;
      --err-bg: #FDF0EF;
      --err-text: #8E271E;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 32px 16px 72px;
    }

    .wrap {
      max-width: 780px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand-name {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--text);
    }

    .brand-sub {
      font-size: 11px;
      letter-spacing: 0.16em;
      color: var(--muted);
    }

    .top-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn-sub {
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 999px;
      cursor: pointer;
      text-decoration: none;
    }

    .btn-sub:hover {
      border-color: var(--accent);
    }

    .hero {
      text-align: center;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 23px;
      font-weight: 700;
    }

    .lead {
      margin: 0;
      font-size: 13px;
      color: var(--muted);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 26px;
      box-shadow: 0 10px 30px rgba(61, 53, 46, 0.05);
    }

    .section-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line);
      margin: 22px 0 16px;
    }

    .section-title:first-child {
      margin-top: 0;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .field {
      margin-bottom: 16px;
    }

    .grid-2 .field {
      margin-bottom: 0;
    }

    .label-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }

    label {
      font-size: 13px;
      font-weight: 700;
    }

    .badge-req {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--req-bg);
      color: var(--req-text);
    }

    input[type="text"],
    input[type="password"],
    input[type="number"],
    select,
    textarea {
      width: 100%;
      padding: 11px 13px;
      font-size: 14px;
      color: var(--text);
      background: #FAF8F5;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
      font-family: inherit;
    }

    textarea {
      min-height: 84px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--accent);
      background: #FFFFFF;
    }

    .chip-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #FAF8F5;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .chip-label input {
      accent-color: var(--accent);
      margin: 0;
    }

    .upload-box {
      border: 1.5px dashed #D8CEBE;
      background: #FAF8F4;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }

    .upload-hint {
      font-size: 12px;
      color: var(--muted);
      margin-top: 8px;
    }

    .preview {
      margin-top: 12px;
      display: none;
      text-align: left;
    }

    .preview img {
      max-width: 100%;
      max-height: 220px;
      border-radius: 10px;
      display: block;
      object-fit: cover;
      border: 1px solid var(--line);
    }

    .meta {
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
      word-break: break-all;
    }

    .btn-primary {
      width: 100%;
      padding: 14px 18px;
      font-size: 15px;
      font-weight: 700;
      color: var(--accent-text);
      background: var(--accent);
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .msg {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      display: none;
      white-space: pre-line;
    }

    .msg.ok { display: block; background: var(--ok-bg); color: var(--ok-text); }
    .msg.err { display: block; background: var(--err-bg); color: var(--err-text); }

    .hidden { display: none; }

    footer {
      text-align: center;
      margin-top: 28px;
      font-size: 12px;
      color: var(--muted);
    }

    @media (max-width: 600px) {
      .card { padding: 18px; }
      .grid-2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <div class="brand-name">SalonBase</div>
        <div class="brand-sub">OWNER ADMIN CONSOLE</div>
      </div>
      <div class="top-actions">
        <a href="/" class="btn-sub">親画面（一覧）を見る</a>
        <button type="button" id="logoutBtn" class="btn-sub hidden" onclick="handleLogout()">ログアウト</button>
      </div>
    </div>

    <!-- ① ログイン画面 -->
    <div id="loginView" class="card">
      <div class="hero" style="margin-bottom: 18px;">
        <h1>オーナーログイン</h1>
        <p class="lead">管理パスワードを入力して、サロン情報の登録・更新画面へ進んでください。</p>
      </div>

      <form id="loginForm">
        <div class="field">
          <div class="label-row">
            <label for="adminPassword">管理パスワード</label>
            <span class="badge-req">必須</span>
          </div>
          <input id="adminPassword" type="password" required placeholder="管理パスワードを入力" />
        </div>
        <button type="submit" id="loginBtn" class="btn-primary">ログインする</button>
        <div class="msg" id="loginMsg" role="alert"></div>
      </form>
    </div>

    <!-- ② ログイン後の管理画面 -->
    <div id="adminView" class="hidden">
      <div class="hero">
        <h1>サロン情報 管理・反映フォーム</h1>
        <p class="lead">写真・サロンイメージ・金額・アイテムを入力して送信すると、親画面のサロン一覧に反映されます。</p>
      </div>

      <form class="card" id="salonForm">
        <div class="section-title">基本情報・金額</div>

        <div class="grid-2 field">
          <div class="field">
            <div class="label-row">
              <label for="name">サロン名</label>
              <span class="badge-req">必須</span>
            </div>
            <input id="name" type="text" required placeholder="例：SalonBase 表参道" />
          </div>

          <div class="field">
            <div class="label-row">
              <label for="pricePerHour">1時間あたりの料金（円）</label>
              <span class="badge-req">必須</span>
            </div>
            <input id="pricePerHour" type="number" min="100" step="10" required placeholder="例：1540" />
          </div>
        </div>

        <div class="grid-2 field">
          <div class="field">
            <div class="label-row">
              <label for="area">エリア名（検索用）</label>
              <span class="badge-req">必須</span>
            </div>
            <input id="area" type="text" required placeholder="例：表参道 / 葛西" />
          </div>

          <div class="field">
            <div class="label-row">
              <label for="station">最寄り駅・徒歩分数</label>
              <span class="badge-req">必須</span>
            </div>
            <input id="station" type="text" required placeholder="例：表参道駅 B2出口 徒歩3分" />
          </div>
        </div>

        <div class="grid-2 field">
          <div class="field">
            <div class="label-row">
              <label for="availabilityBadge">空き状況バッジ</label>
            </div>
            <select id="availabilityBadge">
              <option value="本日空きあり">本日空きあり</option>
              <option value="残りわずか">残りわずか</option>
              <option value="今週末空きあり">今週末空きあり</option>
            </select>
          </div>

          <div class="field">
            <div class="label-row">
              <label for="rating">評価スコア</label>
            </div>
            <input id="rating" type="number" min="1" max="5" step="0.1" value="4.9" />
          </div>
        </div>

        <div class="section-title">施術ジャンル・設備アイテム</div>

        <div class="field">
          <div class="label-row">
            <label>対応施術ジャンル</label>
          </div>
          <div class="chip-group" id="genreChips">
            <label class="chip-label"><input type="checkbox" value="エステ・リラク" checked />エステ・リラク</label>
            <label class="chip-label"><input type="checkbox" value="ネイル" />ネイル</label>
            <label class="chip-label"><input type="checkbox" value="マツエク" />マツエク</label>
            <label class="chip-label"><input type="checkbox" value="整体・ストレッチ" />整体・ストレッチ</label>
            <label class="chip-label"><input type="checkbox" value="ヘアメイク" />ヘアメイク</label>
          </div>
        </div>

        <div class="field">
          <div class="label-row">
            <label>サロン専用設備（絞り込みタグ）</label>
          </div>
          <div class="chip-group" id="equipChips">
            <label class="chip-label"><input type="checkbox" value="電動昇降ベッド" checked />電動昇降ベッド</label>
            <label class="chip-label"><input type="checkbox" value="折り畳みベッド" />折り畳みベッド</label>
            <label class="chip-label"><input type="checkbox" value="完全個室" checked />完全個室</label>
            <label class="chip-label"><input type="checkbox" value="タオルウォーマー" checked />タオルウォーマー</label>
            <label class="chip-label"><input type="checkbox" value="ドレッサー・三面鏡" />ドレッサー・三面鏡</label>
            <label class="chip-label"><input type="checkbox" value="シャワー完備" />シャワー完備</label>
            <label class="chip-label"><input type="checkbox" value="リングライト" />リングライト</label>
            <label class="chip-label"><input type="checkbox" value="駅徒歩5分以内" checked />駅徒歩5分以内</label>
          </div>
        </div>

        <div class="field">
          <div class="label-row">
            <label for="freeAmenitiesText">無料備品・アイテム（1行に1つ、または読点・カンマ区切り）</label>
          </div>
          <textarea id="freeAmenitiesText" placeholder="例：&#10;電動昇降施術ベッド&#10;タオルウォーマー&#10;使い捨て紙シーツ"></textarea>
        </div>

        <div class="section-title">サロンイメージ・写真・入室ルール</div>

        <div class="field">
          <div class="label-row">
            <label for="description">サロンイメージ・空間紹介</label>
          </div>
          <textarea id="description" placeholder="サロンの雰囲気やおすすめポイントを記入してください"></textarea>
        </div>

        <div class="field">
          <div class="label-row">
            <label for="entryRules">入室方法・ご利用ルール</label>
          </div>
          <textarea id="entryRules" placeholder="例：スマートロック対応。退室時はアルコール除菌と換気をお願いします。"></textarea>
        </div>

        <div class="field">
          <div class="label-row">
            <label for="photo">サロン写真アップロード</label>
          </div>
          <div class="upload-box">
            <input id="photo" type="file" accept="image/*" />
            <div class="upload-hint">画像を選択すると自動でアップロードされます（URL直接指定も可能）</div>
            <div class="preview" id="previewBox">
              <img id="previewImg" alt="サロン写真プレビュー" />
              <div class="meta" id="uploadMeta"></div>
            </div>
          </div>
        </div>

        <div class="field">
          <div class="label-row">
            <label for="imageUrl">表示用画像URL（任意・アップロード未実施時の代替URL）</label>
          </div>
          <input id="imageUrl" type="text" placeholder="https://..." />
        </div>

        <button type="submit" id="saveBtn" class="btn-primary">入力内容を送信して親画面に反映する</button>
        <div class="msg" id="adminMsg" role="alert"></div>
      </form>
    </div>

    <footer>© 2026 SalonBase</footer>
  </div>

  <script>
    const API_BASE = "";
    const TOKEN_KEY = "salonbase_admin_token";

    let uploadedImageKey = "";
    let uploadedImageUrl = "";

    const loginView = document.getElementById("loginView");
    const adminView = document.getElementById("adminView");
    const logoutBtn = document.getElementById("logoutBtn");
    const loginForm = document.getElementById("loginForm");
    const loginMsg = document.getElementById("loginMsg");
    const salonForm = document.getElementById("salonForm");
    const adminMsg = document.getElementById("adminMsg");
    const photoInput = document.getElementById("photo");
    const previewBox = document.getElementById("previewBox");
    const previewImg = document.getElementById("previewImg");
    const uploadMeta = document.getElementById("uploadMeta");
    const saveBtn = document.getElementById("saveBtn");

    function getToken() {
      return sessionStorage.getItem(TOKEN_KEY) || "";
    }

    function setToken(token) {
      if (token) sessionStorage.setItem(TOKEN_KEY, token);
      else sessionStorage.removeItem(TOKEN_KEY);
    }

    function updateViewByAuth() {
      const hasToken = Boolean(getToken());
      loginView.classList.toggle("hidden", hasToken);
      adminView.classList.toggle("hidden", !hasToken);
      logoutBtn.classList.toggle("hidden", !hasToken);
    }

    function showBoxMsg(el, type, text) {
      el.className = `msg ${type}`;
      el.textContent = text;
    }

    function handleLogout() {
      setToken("");
      updateViewByAuth();
    }

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      loginMsg.className = "msg";
      const password = document.getElementById("adminPassword").value;

      try {
        const res = await fetch(`${API_BASE}/api/auth/login`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ password }),
        });
        const data = await res.json();
        if (!res.ok || !data.ok || !data.token) {
          throw new Error(data.error || "パスワードが正しくありません");
        }
        setToken(data.token);
        loginForm.reset();
        updateViewByAuth();
      } catch (err) {
        showBoxMsg(loginMsg, "err", err.message);
      }
    });

    photoInput.addEventListener("change", async ()
